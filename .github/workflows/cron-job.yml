name: 10-Minute Server Ping

on:
  schedule:
    # Runs every 10 minutes, every day
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Ping to Server Root
        run: |
          # -I: Fetch headers only
          # -s: Silent mode (hide progress bar)
          # -f: Fail silently (HTTP 4xx/5xx return non-zero exit code)
          # -L: Follow redirects
          curl -IsfL https://crop-fertiliser-model.onrender.com
          
      - name: Log Success
        run: echo "Ping successful at $(date)"